<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>오델로</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <canvas id="bg"></canvas>
    <!-- 처음 화면 -->
    <section id="scr-menu" class="screen on">
      <div class="logo"><span class="stone b"></span>오델로<span class="stone w"></span></div>
      <div class="menu-btns">
        <button id="go-ladder" class="big sun">단계 도전</button>
        <button id="go-free" class="big mint">자유 대전</button>
        <button id="go-two" class="big grape">둘이서 하기</button>
      </div>
      <div id="menu-stars"></div>
      <div id="menu-hearts" class="hearts"></div>
      <div id="app-version">오델로 0.5.0</div>
    </section>

    <!-- 단계 고르기 -->
    <section id="scr-ladder" class="screen">
      <div class="head"><button class="back">‹ 뒤로</button><div class="h">단계 도전</div><div class="h-side"><div id="ladder-stars"></div><div id="ladder-hearts" class="hearts"></div></div></div>
      <div id="worlds"><button id="w-prev">‹</button><div id="w-name"></div><button id="w-story">이야기</button><button id="w-next">›</button></div>
      <div id="stages"></div>
    </section>

    <!-- 자유 대전 설정 -->
    <section id="scr-free" class="screen">
      <div class="head"><button class="back">‹ 뒤로</button><div class="h">자유 대전</div><div class="h-side"></div></div>
      <div class="opts">
        <div class="opt"><div class="lbl">판 크기</div><div class="seg" id="opt-size"></div></div>
        <div class="opt"><div class="lbl">컴퓨터 세기</div><div class="seg wrap" id="opt-level"></div></div>
        <div class="opt"><div class="lbl">내 돌</div><div class="seg" id="opt-color"></div></div>
        <div class="note">컴퓨터 세기는 단계 도전에서 연 단계까지 고를 수 있어요</div>
        <button id="free-start" class="big mint">시작</button>
      </div>
    </section>

    <!-- 게임 -->
    <section id="scr-game" class="screen">
      <main id="stage"><canvas id="board"></canvas></main>
      <aside id="side">
        <div class="title" id="g-title">오델로</div>
        <div id="g-hearts" class="hearts"></div>
        <div id="score">
          <div class="pl black"><span class="stone b"></span><b id="s-black">2</b><i id="n-black">나</i></div>
          <div class="pl white"><span class="stone w"></span><b id="s-white">2</b><i id="n-white">컴퓨터</i></div>
        </div>
        <div id="turn"></div>
        <div id="missions"></div>
        <div class="btns">
          <button id="btn-hint">힌트</button>
          <button id="btn-undo">되돌리기</button>
          <button id="btn-restart">다시 하기</button>
          <button id="btn-menu">메뉴</button>
        </div>
      </aside>
    </section>

    <!-- 결과 -->
    <div id="result" class="overlay">
      <div class="card">
        <div id="r-stars"></div>
        <div id="r-title"></div>
        <div id="r-sub"></div>
        <div id="r-missions"></div>
        <div class="row">
          <button id="r-again">다시 하기</button>
          <button id="r-next" class="mint">다음 단계</button>
          <button id="r-menu">메뉴</button>
        </div>
      </div>
    </div>
    <!-- 새 장치 설명 -->
    <div id="intro" class="overlay">
      <div class="card">
        <canvas id="intro-pic"></canvas>
        <div id="i-title"></div>
        <div id="i-text"></div>
        <div class="row"><button id="i-ok" class="mint">시작!</button></div>
      </div>
    </div>
    <!-- 진행 중인 판을 그만둘지 묻기 (잘못 눌러 나가지 않게) -->
    <div id="confirm" class="overlay">
      <div class="card">
        <div id="c-title"></div>
        <div id="c-text">지금 하던 판은 사라져요.</div>
        <div class="row">
          <button id="c-no" class="mint">계속하기</button>
          <button id="c-yes">그만두기</button>
        </div>
      </div>
    </div>
    <!-- 이야기 -->
    <div id="story" class="overlay">
      <div class="card">
        <div id="s-world"></div>
        <div class="s-row"><canvas id="s-face"></canvas><div class="s-body"><div id="s-name"></div><div id="s-text"></div></div></div>
        <div class="row"><button id="s-skip">건너뛰기</button><button id="s-next" class="mint">다음 ›</button></div>
      </div>
    </div>
    <!-- 하트가 없을 때 -->
    <div id="nohearts" class="overlay">
      <div class="card">
        <div class="nh-big">♥</div>
        <div id="nh-title">하트가 없어요</div>
        <div id="nh-text">하트는 30분마다 하나씩 다시 생겨요.<br>다음 하트까지 <b id="nh-time"></b></div>
        <div class="row"><button id="nh-ok" class="mint">기다릴게요</button></div>
      </div>
    </div>
    <div id="toast"></div>
  </div>
  <script src="src/samples.js"></script>
  <script src="src/sfx.js"></script>
  <script src="src/sound.js"></script>
  <script src="src/bg.js"></script>
  <script src="src/engine.js"></script>
  <script src="src/ai.js"></script>
  <script src="src/story.js"></script>
  <script src="src/stages.js"></script>
  <script src="src/puzzles.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
